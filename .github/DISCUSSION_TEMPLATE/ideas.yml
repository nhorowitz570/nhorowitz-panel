body:
  - type: markdown
    attributes:
      value: |
        Ideas start here. If maintainers and the community like one, it becomes an issue someone can build. Upvote ideas you want rather than adding a +1 comment.
  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you'd like it to work. Sketches and screenshots welcome.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do now instead
